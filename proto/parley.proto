syntax = "proto3";

package parley.v1;

option csharp_namespace = "Parley.Transport";

// The Parley wire contract, per SPEC.md section 4.0. The version is ProtocolVersion.Current.
//
// SPEC.md is the authority and this file is not. A message defined here and absent there is a
// defect here; a rule stated there and unrepresentable here is a defect here too -- the same
// relationship the storage schema of section 9.2 has to the document, one layer out.
//
// Three services, because there are three kinds of caller and the split is worth enforcing at the
// wire rather than remembering in code:
//
//   Agents     what an adapter may do, on behalf of one participant     (section 10.1)
//   Operators  what a person may do, on behalf of nobody                (section 10.2)
//   Nodes      what a machine may do, on behalf of the agents it hosts  (section 4)
//
// There is no method on Agents that retires anybody, closes a conversation over its participants,
// or reads another participant's traffic, so no confusion about which client is in hand can
// produce a call that does.
//
// Timestamps are RFC 3339 in UTC, carried as strings rather than google.protobuf.Timestamp. The
// store's canonical form is text of exactly this shape; a second representation on the wire would
// be two formats that agree until one of them meets a value the other rounds.

// ===========================================================================================
// Agents -- SPEC.md section 10.1
// ===========================================================================================

service Agents {
  // Attaches a participant and holds the connection open for as long as it is running.
  //
  // SPEC.md section 4.0: a connection is evidence. The stream being open IS the participant being
  // reachable -- there is no heartbeat and no timestamp to age. There is no Detach, because it
  // could only be a second, optional way to say what the stream already says for certain.
  //
  // The first Event is always attached. Everything after it is a notice.
  rpc Attach(AttachRequest) returns (stream Event);

  // Sends a Request (section 5.1). `to` is a whole name, reaching one participant, or a bare role,
  // opening one ordinary exchange with each participant registered under it (section 5.5). The
  // broker assigns the conversation from what the sender holds (section 5.0).
  rpc Request(OpenRequest) returns (RequestReply);

  rpc Clarify(ClarifyRequest) returns (SayReply);
  rpc Result(ResultRequest) returns (SayReply);
  rpc Conclude(ConcludeRequest) returns (ConcludeReply);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsReply);

  // Everything waiting, taken once, each message already inside the section 13 envelope. The only
  // path a participant's words travel to a model.
  rpc DrainInbox(DrainInboxRequest) returns (InboxReply);

  // How much is waiting, without taking any of it. For a caller that holds no stream -- an editor
  // hook that wants to say "work is waiting" before a turn. Marks nothing delivered.
  rpc Waiting(WaitingRequest) returns (Notice);

  // Records that an adapter refused to send something for being over the size cap. Length only,
  // never the payload: that is the material the cap exists to keep out of a context.
  rpc RecordRefusal(RecordRefusalRequest) returns (Empty);

  // Places a file from the agent's own repository in a conversation's folder of the file location (section 9.5).
  // The first frame is a header naming the conversation and the file; every later frame carries bytes. The
  // conversation is assigned as a Request's is (section 5.0), and placing makes the placer a participant.
  rpc PlaceFile(stream PlaceFileFrame) returns (PlaceFileReply);

  // Streams one whole content of a file: a header and then bytes, or a refusal instead of the header. While the
  // call is open the stored file is held for reading and a replacement or removal waits. The adapter writes the
  // bytes to disk; nothing carries them into a model's context.
  rpc FetchFile(FetchFileRequest) returns (stream FetchFileFrame);

  // Reports that a fetch was written and verified. Only then is it recorded, so change notices follow. A report of
  // a fetch the broker did not stream to this agent, or of a hash it did not stream, is refused.
  rpc FetchedFile(FetchedFileRequest) returns (FetchedFileReply);

  // A page of the files in the location: names, sizes, hashes and placers, never contents.
  rpc ListFiles(ListFilesRequest) returns (FilesReply);

  // Removes files the calling agent placed. Every other name is refused, naming its placer.
  rpc RemoveOwnFiles(RemoveFilesRequest) returns (RemoveFilesReply);

  // Puts a roadmap forward for a person to confirm (section 5.7). Stores a proposal and nothing else: it opens no
  // exchange, writes no message and creates no roadmap. This is the whole of what an agent can do with one -- there
  // is no read, no change and no marking done, and none may be added (principle 2.12).
  rpc ProposeRoadmap(ProposeRoadmapRequest) returns (ProposeRoadmapReply);
}

message AttachRequest {
  string agent = 1;              // role@machine
  string adapter = 2;
  AgentTier tier = 3;
  string workspace = 4;          // empty when the adapter cannot say
  string session_ref = 5;
  string adapter_config = 6;
  string owns = 7;
  string protocol_version = 8;
  string launch_token = 9;       // what the node that started this process put in its environment; empty when none did (section 11.7)

  // The repository's identifier (`parleyAgentId`), empty when it has none. A label and never authority (section 4.1.1):
  // presented under a name the project does not hold, from the workspace and machine that hold it, it renames the agent.
  string identity = 10;
}

message Event {
  oneof event {
    Attached attached = 1;
    Notice notice = 2;
  }
}

message Attached {
  int32 agent_marked_live = 1;

  // Work the participant had collected in a session that ended before its Result, handed over again
  // on its next collection (section 6). Nothing about that work changed; it was open throughout.
  int32 exchanges_redelivered = 2;
}

// The broker speaking first. Counts only -- never a payload, a sender or a subject. Section 13 has a
// participant's words reach a model inside an envelope applied on the way out of DrainInbox, and a
// notice carrying the words would be a second path for the same text with no envelope on it.
message Notice {
  int32 messages_waiting = 1;
  int32 closure_polls_waiting = 2;
  int32 file_notices_waiting = 3;     // section 9.5: counted like the rest, and never waking anything
  int32 roadmap_notices_waiting = 4;  // section 5.7: what became of the agent's own proposals; wakes nothing
}

message OpenRequest {
  string from = 1;
  string to = 2;                 // a whole name, or a bare role
  string responder_model = 3;
  string payload_json = 4;       // the ask -- section 5.1

  // The conversation the sender names, or empty. Whether it may name one, and which, depends on the
  // Requests it holds (section 5.0); the broker refuses the rest and says what it may name.
  string conversation_id = 5;
}

// One outcome per exchange a Request opened, or a single refusal when none could be opened.
message RequestReply {
  repeated RequestOutcome outcomes = 1;
}

message RequestOutcome {
  bool ok = 1;
  RequestRejection rejection = 2;
  int64 exchange_id = 3;         // 0 on a refusal
  string receiver = 4;
  string request_group = 5;      // set only for a member of a Request to a role
  string conversation_id = 6;    // the conversation the broker assigned

  // What makes each refusal actionable rather than an instruction to retry (section 7.3).
  //   SATURATED: every exchange the sender has open with that receiver.
  //   DUPLICATE: the single exchange already carrying this Request.
  repeated int64 open_exchanges = 7;
  //   CONVERSATION_NOT_ASSIGNABLE: the conversations the sender may name.
  repeated string assignable_conversations = 8;
  //   CONVERSATION_CLOSED: who closed it, when recorded.
  ConversationCloser closed_by = 9;

  // On success, the cycle this Request closed, if it closed one -- admitted and recorded on the
  // conversation rather than refused (section 7.2). Empty otherwise.
  repeated string cycle = 10;

  // What became of the receiver (section 5.4). None of these is a refusal: the Request is stored
  // before any of it is decided.
  WakeOutcome wake = 11;
}

message ClarifyRequest {
  string from = 1;
  int64 exchange_id = 2;
  string responder_model = 3;
  string payload_json = 4;

  // Exchanges the person's Request settled (section 5.6). Only on a reply from the receiver of a Request the person opened
  // with this agent; anything named that cannot be settled refuses the whole reply. At most 50; a repeated id counts once.
  repeated int64 settles = 5;
}

message ResultRequest {
  string from = 1;
  int64 exchange_id = 2;
  string responder_model = 3;

  // One outcome for the ask as a whole (section 5.3), recorded against the id "request". The exchange's
  // rolled-up outcome is derived by the broker from this and is deliberately not a field: a sender that could
  // state it separately could state one its own outcome contradicts.
  string payload_json = 4;

  // As on ClarifyRequest (section 5.6).
  repeated int64 settles = 5;
}

message SayReply {
  bool ok = 1;
  TransitionError refusal = 2;
  bool deduplicated = 3;
  int64 message_id = 4;

  // On CANNOT_SETTLE, each exchange named that could not be settled and why. Nothing was stored (section 5.6).
  repeated SettleRefusal cannot_settle = 5;

  // On success, what the reply's settles did: the agent's own questions closed as settled, and the person's own Requests
  // handed back to the agent.
  repeated int64 settled = 6;
  repeated int64 handed_back = 7;
}

message SettleRefusal {
  int64 exchange_id = 1;
  SettleProblem problem = 2;
}

message ConcludeRequest {
  string from = 1;
  string conversation_id = 2;
  Vote vote = 3;
}

message ConcludeReply {
  bool ok = 1;
  ClosureError refusal = 2;
  bool concluded = 3;
}

message ListAgentsRequest {
  string asking_as = 1;
}

message ListAgentsReply {
  repeated AgentSummary agents = 1;
}

message AgentSummary {
  string name = 1;
  string adapter = 2;
  AgentTier tier = 3;
  AgentPresence presence = 4;
  string owns = 5;
}

message DrainInboxRequest {
  string agent = 1;
  int32 limit = 2;
}

message InboxReply {
  repeated DeliveredMessage messages = 1;
  repeated ClosurePoll closure_polls = 2;

  // Section 9.5. Not messages: nothing is owed back. At most 200 in one collection, oldest change first, whatever
  // `limit` says about messages; the rest wait for the agent's next collection and are counted here.
  repeated FileNotice file_notices = 3;
  int32 file_notices_waiting = 4;

  // Section 5.7. What became of this agent's own roadmap proposals, with its own title. Not messages: nothing is
  // owed back and nothing is woken.
  repeated RoadmapNotice roadmap_notices = 5;
  int32 roadmap_notices_waiting = 6;
}

// That a file the agent fetched has changed or gone since. A name and two hashes, never the content.
message FileNotice {
  string conversation_id = 1;
  string name = 2;
  string sha256_had = 3;              // what the agent fetched
  string sha256_now = 4;              // empty when gone
  int64 size_bytes = 5;               // 0 when gone
  string changed_utc = 6;
  bool gone = 7;
}

// ===========================================================================================
// Files -- SPEC.md section 9.5
//
// What crosses about a file is its name, size, hash and placer. Its bytes travel only inside PlaceFile and
// FetchFile, in pieces well under the default message limit, and land on disk on either side.
// ===========================================================================================

message PlaceFileFrame {
  oneof frame {
    PlaceFileHeader header = 1;       // first, and only first
    bytes chunk = 2;                  // at most 256 KiB
  }
}

message PlaceFileHeader {
  string agent = 1;                   // the adapter's launch identity, as every Agents call carries
  string conversation_id = 2;         // empty: assigned by the broker (section 5.0)
  string name = 3;                    // section 9.5's rules; only .md and .txt
}

message PlaceFileReply {
  PlaceOutcome outcome = 1;
  FileRejection rejection = 2;        // NONE when the file was placed, replaced or already current
  string conversation_id = 3;
  string name = 4;
  int64 size_bytes = 5;
  string sha256 = 6;                  // the broker's, never the placer's
  string previous_sha256 = 7;         // on REPLACED
  string placed_by = 8;               // on NAME_PLACED_BY_ANOTHER; empty there means the person
  repeated string assignable_conversations = 9;   // on CONVERSATION_NOT_ASSIGNABLE, as a Request's refusal carries
  int32 characters_left = 10;         // on DOES_NOT_FIT: the longest name the conversation's folder allows
  string detail = 11;                 // on a refusal, the rule in words
  string requested_name = 12;         // the name asked for, when characters outside the set renamed it (section 9.5)
}

message FetchFileRequest {
  string agent = 1;
  string conversation_id = 2;         // empty: looked for across the location
  string name = 3;
  string expect_sha256 = 4;           // empty: no expectation
}

message FetchFileFrame {
  oneof frame {
    SharedFileView header = 1;        // size, hash and placer of the content about to be streamed
    bytes chunk = 2;
    FileRefusal refusal = 3;          // sent instead of a header
  }
}

message FileRef {
  string conversation_id = 1;         // empty: looked for across the location
  string name = 2;
}

message FileRefusal {
  FileRef file = 1;
  FileRejection rejection = 2;
  string placed_by = 3;               // on NAME_PLACED_BY_ANOTHER; empty there means the person
  repeated string conversations = 4;  // on AMBIGUOUS_NAME: at most 200 holding the name
  int32 conversations_more = 5;       // how many more hold it than are listed
  string sha256_now = 6;              // on CHANGED: the hash the location holds
  string detail = 7;                  // the rule, in words
}

message FetchedFileRequest {
  string agent = 1;
  string conversation_id = 2;
  string name = 3;
  string sha256 = 4;                  // what the adapter verified it wrote
}

message FetchedFileReply {
  bool ok = 1;
  FileRejection rejection = 2;        // NOT_FETCHED: no completed stream of that content to this agent
}

message ListFilesRequest {
  string agent = 1;                   // empty on the Operators service
  string conversation_id = 2;         // empty for every conversation
  int32 page_size = 3;                // 0 for 50; the broker bounds this at 200 whatever is asked for
  string page_token = 4;              // empty for the first page
}

message SharedFileView {
  string conversation_id = 1;
  string name = 2;
  int64 size_bytes = 3;
  string sha256 = 4;
  string placed_by = 5;               // empty: the person
  string placed_utc = 6;
  string changed_utc = 7;
  string folder = 8;                  // the conversation's folder on disk
}

message FilesReply {
  repeated SharedFileView files = 1;              // one page, ordered by conversation and then name
  repeated ConversationFilesTotal totals = 2;     // the conversations on this page, each counted whole
  int64 total_bytes = 3;                          // everything listed, whatever the page
  repeated FilePlacementCount placements = 4;     // Operators only
  string next_page_token = 5;                     // empty at the end
  int32 total_files = 6;                          // the files total_bytes counts
  int32 files_not_listed = 7;                     // Operators only: files in the listed folders whose names break section 9.5's rules
}

message ConversationFilesTotal {
  string conversation_id = 1;
  int32 files = 2;
  int64 bytes = 3;
}

message FilePlacementCount {
  string agent = 1;                   // kept after the agent is purged
  int64 placements = 2;
  int64 bytes = 3;
  string last_utc = 4;
}

message RemoveFilesRequest {
  string agent = 1;                   // empty on the Operators service
  repeated FileRef files = 2;         // at most 200; more is refused whole
}

message RemoveFilesReply {
  repeated FileRef removed = 1;
  repeated FileRefusal refused = 2;
  int64 bytes_freed = 3;
  FileRejection rejection = 4;        // TOO_MANY_NAMES when nothing was removed for that reason
}

message PruneFilesReply {
  int32 files_removed = 1;
  int64 bytes_freed = 2;
}

message FileLocationRequest {
  string conversation_id = 1;         // empty: the whole location
  string name = 2;                    // empty: the folder
}

message FileLocationReply {
  bool ok = 1;
  FileRefusal refusal = 2;            // when not ok
  string machine = 3;                 // the broker's machine name (section 4.1.1)
  string path = 4;                    // absolute, on that machine
}

enum FileRejection {
  FILE_REJECTION_UNSPECIFIED = 0;
  FILE_REJECTION_NONE = 1;
  FILE_REJECTION_BAD_NAME = 2;
  FILE_REJECTION_NAME_PLACED_BY_ANOTHER = 3;
  FILE_REJECTION_NO_SUCH_FILE = 4;
  FILE_REJECTION_AMBIGUOUS_NAME = 5;
  FILE_REJECTION_CONVERSATION_NOT_ASSIGNABLE = 6;
  FILE_REJECTION_CONVERSATION_CLOSED = 7;
  FILE_REJECTION_CHANGED = 8;
  FILE_REJECTION_NO_SPACE = 9;
  FILE_REJECTION_EXTENSION_NOT_ALLOWED = 10;
  FILE_REJECTION_NOT_FETCHED = 11;
  FILE_REJECTION_TOO_MANY_NAMES = 12;
  FILE_REJECTION_SAFE_NAME_TAKEN = 13;  // a renamed placement's safe spelling is already another file's name
}

enum PlaceOutcome {
  PLACE_OUTCOME_UNSPECIFIED = 0;
  PLACE_OUTCOME_PLACED = 1;
  PLACE_OUTCOME_REPLACED = 2;
  PLACE_OUTCOME_ALREADY_CURRENT = 3;
  PLACE_OUTCOME_PLACED_BY_ANOTHER = 4;
  PLACE_OUTCOME_DOES_NOT_FIT = 5;
}

// A message and the envelope that marks it as a participant's words, per section 13. Built by the
// broker and carried, rather than left for each adapter to construct.
message DeliveredMessage {
  Message message = 1;
  string envelope = 2;

  // Only beside a Request from the person: the receiving agent's own open questions to the person in that conversation,
  // oldest first, at most 20, and how many more there are (section 5.6). The agent's own words, cut at 160 characters.
  repeated SettleableQuestion settleable = 3;
  int32 settleable_left_out = 4;

  // Only beside a person's Request the receiving agent had asked back about: what the person has said to it in that
  // conversation since it last spoke on the exchange, oldest first, at most 5, each in its own envelope (section 5.6).
  repeated AnswerSince since = 5;
}

message AnswerSince {
  int64 exchange_id = 1;
  string sent_utc = 2;
  string envelope = 3;
}

message SettleableQuestion {
  int64 exchange_id = 1;
  string opened_utc = 2;
  string asked = 3;
}

message Message {
  int64 id = 1;
  int64 exchange_id = 2;         // every message belongs to one (section 5)
  MessageType type = 3;
  string from = 4;
  string to = 5;
  string responder_model = 6;
  string payload_json = 7;
  string conversation_id = 8;
  string created_utc = 9;
  string delivered_utc = 10;
}

// No deadline: silence does not assent (section 5.0).
message ClosurePoll {
  string conversation_id = 1;
  string polled_utc = 2;
}

message WaitingRequest {
  string agent = 1;
}

message RecordRefusalRequest {
  string agent = 1;
  MessageType type = 2;
  int32 characters = 3;
}

// ===========================================================================================
// Nodes -- SPEC.md section 4
// ===========================================================================================

service Nodes {
  // Announces a machine and holds the connection open for as long as it is up. The broker sends a
  // Start down this stream when something is waiting on an agent registered here and not running,
  // and a turn when it is running.
  rpc Join(JoinRequest) returns (stream NodeCommand);

  // What the node observed about itself. Detected, never configured (section 4.1.1).
  rpc Describe(DescribeNodeRequest) returns (DescribeNodeReply);

  // A turn this node gave an agent began or ended (section 11.6). Ignored unless the agent is on this
  // node's machine and the node is joined. A failure here never fails the turn.
  rpc ReportTurn(TurnReport) returns (Empty);

  // This node is about to start an agent, with this token in its environment (section 11.7). The adapter presents
  // the token on attach, which is how the broker tells a process Parley started from one opened outside it. Ignored
  // unless the agent is on this node's machine and the node is joined. A failure here never stops the launch.
  rpc ReportLaunch(LaunchReport) returns (Empty);
}

message LaunchReport {
  string machine = 1;
  string agent = 2;
  string token = 3;     // chosen by the node for this one launch
}

message JoinRequest {
  string machine = 1;
  NodeFacts facts = 2;
  repeated string startable_roles = 3;   // what this node's catalogue can launch
  // This node reports its turns (section 11.6). A node that does not say so leaves its agents' turn standing unknown
  // rather than stopped: nothing reported must not read as stopped.
  bool reports_turns = 4;

  // The identifiers (`parleyAgentId`) of the checkouts this node can launch for this project. A node can start an agent
  // by the identifier alone, so a repository whose role was renamed is still startable under the name the broker holds.
  repeated string startable_identities = 5;
}

message TurnReport {
  string machine = 1;
  string agent = 2;
  oneof phase {
    TurnStarted started = 3;
    TurnEnded ended = 4;
  }
}

message TurnStarted {
  string started_utc = 1;
}

message TurnEnded {
  string started_utc = 1;          // pairs it with its start
  int64 elapsed_ms = 2;
  bool clean = 3;                  // completed, and not an error
  bool timed_out = 4;
  bool process_died = 5;
  int32 permission_denials = 6;    // tool calls refused for want of permission
  double cost_usd = 7;
  int32 model_turns = 8;
}

message NodeFacts {
  string os = 1;
  string os_version = 2;
  string ip_address = 3;
  string domain = 4;
}

message NodeCommand {
  oneof command {
    // Always first. A stream that says nothing until something happens leaves a node unable to tell
    // "joined, and quiet" from "still connecting" or "refused".
    Joined joined = 1;

    StartAgent start = 2;
    GiveTurn turn = 3;

    // Restart an agent this node started, once its current turn is over, so it reads its launch configuration afresh.
    // Sent once, for an agent's first ownership line accepted automatically (section 11.1), and never for an agent the
    // node did not start.
    RefreshAgent refresh = 4;
  }
}

message RefreshAgent {
  string agent = 1;
  string because = 2;            // for the operator's benefit, never the agent's
  string identity = 3;           // which checkout, when the broker knows; the node finds it by this and not by the name
}

message Joined {
  string machine = 1;

  // What the broker already knows lives here, so a node can reconcile: an agent registered to this
  // machine that the node cannot launch is a repository that moved or was renamed.
  repeated string agents = 2;

  // The identifier of each of those that presented one, by name, so a node can tell an agent whose repository was renamed
  // since it registered from one this machine cannot start (section 4.1.1).
  map<string, string> identities = 3;
}

message StartAgent {
  string agent = 1;
  string because = 2;            // for the operator's benefit, never the agent's
  string identity = 3;           // which checkout, when the broker knows; the node finds it by this and not by the name
}

// A turn, for an agent this node already holds. Distinct from StartAgent because a second process
// for one agent is worse than a late collection, and only the node knows which sessions are its own:
// it gives a turn only to its own resident, and does nothing for an agent attached through somebody's
// editor window.
message GiveTurn {
  string agent = 1;
  string because = 2;            // for the operator's benefit, never the agent's
  string identity = 3;           // which checkout, when the broker knows; the node finds it by this and not by the name
}

message DescribeNodeRequest {
  string machine = 1;
}

message DescribeNodeReply {
  string machine = 1;
  bool connected = 2;
  NodeFacts facts = 3;
  repeated string agents = 4;
}

// ===========================================================================================
// Operators -- SPEC.md section 10.2
// ===========================================================================================

service Operators {
  // How the person closes a conversation (section 5.0). Every exchange still open in it ends closed,
  // and every participant holding one is sent the broker's closed Result in the same write.
  rpc ForceConclude(ForceConcludeRequest) returns (DidItReply);
  rpc Retire(AgentRequest) returns (DidItReply);
  rpc Reinstate(AgentRequest) returns (DidItReply);
  rpc Purge(AgentRequest) returns (PurgeReply);

  // What a person agreed an agent owns, recorded with how they arrived at it (section 17 question 10).
  // It does NOT write the registry's `owns`: that is filled from the launch environment when the agent
  // attaches (section 12.3), so the reply carries what peers read now beside what was accepted.
  rpc RecordOwnership(RecordOwnershipRequest) returns (RecordOwnershipReply);

  // Parley's questions (section 10.2). Every one is the person's view of what the facilitator did or a
  // decision about an answer it read back; none lets anybody speak as the facilitator except through
  // ReplyToAskedBack, whose words are recorded as the person's (`parley:person`), never as Parley's.
  rpc Facilitation(Empty) returns (FacilitationReply);
  rpc SetAutoAccept(SetAutoAcceptRequest) returns (SetAutoAcceptReply);
  rpc AskAgain(AgentRequest) returns (FacilitationActionReply);
  rpc ReplyToAskedBack(ReplyToAskedBackRequest) returns (FacilitationActionReply);
  rpc DiscardAnswer(AgentRequest) returns (FacilitationActionReply);

  rpc DescribeRegistry(Empty) returns (RegistryReply);
  rpc DescribeRefusals(Empty) returns (RefusalsReply);
  rpc DescribeClarifications(Empty) returns (ClarificationsReply);

  // What Results have said: outcomes by responder, blockers by kind, sources, closures (section 15).
  rpc DescribeResults(Empty) returns (ResultsReply);

  // The work in front of the person: open exchanges gone quiet or owed by a retired agent, and cycles
  // (sections 6 and 7.2).
  rpc DescribeFlags(Empty) returns (FlagsReply);

  rpc Export(ExportRequest) returns (ExportReply);

  // Takes no policy: retention belongs to the deployment, and the broker reads its own configuration.
  rpc Prune(Empty) returns (PruneReply);

  // Broker V1. Implements is asked first, because a contract whose version cannot be discovered is one
  // nobody can rely on.
  rpc Implements(Empty) returns (ImplementsReply);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsReply);
  rpc DescribeWaiting(Empty) returns (WaitingReply);

  // Filing, not muting: delivery is unchanged and no participant is told.
  rpc Archive(ConversationRequest) returns (DidItReply);
  rpc Unarchive(ConversationRequest) returns (DidItReply);

  // Deletes a conversation for every participant. An open exchange inside it ceases to exist, so
  // whoever was waiting is never told anything at all -- which is why closing first is recommended.
  rpc Destroy(ConversationRequest) returns (DestroyReply);

  // Roadmaps (section 5.7, principle 2.12). The person's: nothing here is reachable from the Agents service.
  // Roadmap returns facts about each item's conversation and never a state; the surface derives that.
  rpc Roadmaps(Empty) returns (RoadmapsReply);
  rpc Roadmap(RoadmapRequest) returns (RoadmapReply);
  rpc Proposals(ProposalsRequest) returns (ProposalsReply);
  rpc ConfirmProposal(ConfirmProposalRequest) returns (RoadmapChangeReply);
  rpc DeclineProposal(ProposalRequest) returns (RoadmapChangeReply);
  rpc EditRoadmap(EditRoadmapRequest) returns (RoadmapChangeReply);

  // Causes a launch and never a registration (section 12.3).
  rpc Start(StartRequest) returns (DidItReply);

  // The file location (section 9.5). Removing any file and pruning them all are the person's, because they remove
  // files other agents placed. Describing where a file is lets a surface on that machine open it in place.
  rpc ListSharedFiles(ListFilesRequest) returns (FilesReply);
  rpc RemoveFiles(RemoveFilesRequest) returns (RemoveFilesReply);
  rpc PruneFiles(Empty) returns (PruneFilesReply);
  rpc DescribeFileLocation(FileLocationRequest) returns (FileLocationReply);
}

message Empty {}

message AgentRequest {
  string agent = 1;
}

message DidItReply {
  bool changed = 1;
}

message ForceConcludeRequest {
  string conversation_id = 1;

  // Why, told to every participant holding open work. Shortened rather than refused when long: a close
  // that cannot be stored is a close nobody is told about.
  string reason = 2;
}

message PurgeReply {
  PurgeVerdict verdict = 1;
  repeated PurgeToll destroyed = 2;
}

message PurgeToll {
  string table = 1;
  int32 rows = 2;
}

message ConversationRequest {
  string conversation_id = 1;
}

message DestroyReply {
  DestroyVerdict verdict = 1;
  repeated PurgeToll destroyed = 2;
}

enum DestroyVerdict {
  DESTROY_VERDICT_NO_SUCH_CONVERSATION = 0;
  DESTROY_VERDICT_GONE = 1;
}

message StartRequest {
  string agent = 1;
  string because = 2;              // for whoever reads the node's log
}

message RegistryReply {
  repeated RegistryRow rows = 1;
}

message RegistryRow {
  string name = 1;
  string adapter = 2;
  AgentTier tier = 3;
  AgentStatus status = 4;
  AgentPresence presence = 5;
  string workspace = 6;
  string session_ref = 7;
  string owns = 8;
  bool connected = 9;
  // What a person accepted, which is not what peers read until the agent restarts: the registry's
  // `owns` is filled from the launch environment on attach (section 12.3) and no operation writes it.
  // Empty when nobody has accepted a line, and equal to `owns` once the agent has come back with it.
  //
  // Both halves travel rather than a `pending` flag, so a surface can show the two lines side by side
  // and say which is which. A flag would carry the comparison and lose the thing being compared.
  string owns_accepted = 10;
  // How that accepted line was arrived at, so a surface can show a line accepted automatically apart from one a
  // person decided (section 10.2). UNSPECIFIED when nobody has accepted a line.
  //
  // There is no `facilitator` field beside it on purpose. The facilitator's row is the one whose adapter is
  // `parley-facilitator`, and storage ties that adapter to the reserved role in both directions -- so a flag would be
  // a second statement of one fact, free to disagree with the first.
  OwnershipSource owns_source = 11;

  // The agent's turn standing (section 11.6): what its node said about the turns it gives. Operator-only --
  // the agent roster (`ListAgentsReply`) carries none of it, because how another agent's turns went is not a peer's to
  // read (section 10.1).
  //
  // `turns_reported` false means nobody reports this agent's turns -- its node does not say so, or it is an agent
  // attached from somebody's editor -- and a surface must then say neither working nor stopped.
  bool turns_reported = 12;
  string turn_running_since_utc = 13;        // empty when no turn is running
  string last_turn_ended_utc = 14;           // empty before the first reported turn
  bool last_turn_clean = 15;
  int32 last_turn_permission_denials = 16;
  // Running, and only as a process Parley did not start (section 11.7): no node can give it a turn.
  bool open_outside = 17;

  // The repository's identifier (section 4.1.1), empty when the agent presented none. Never shown: a surface uses it to
  // tell a catalogued checkout from an agent already registered under another name, and to name the checkout to a node.
  string identity = 18;
}

message RefusalsReply {
  repeated SizeRefusal refusals = 1;
}

message SizeRefusal {
  string agent = 1;
  MessageType type = 2;
  int32 refusals = 3;
  int32 worst = 4;
  int64 total = 5;
  int32 cap = 6;
  string last_utc = 7;
}

message ClarificationsReply {
  repeated ClarifyDepthBucket distribution = 1;
  int64 exchanges_at_cap = 2;
  int64 lowest_cap_in_force = 3;
  int64 highest_cap_in_force = 4;
  int64 results = 5;
  int64 results_with_mixed_outcomes = 6;
}

message ClarifyDepthBucket {
  int32 depth = 1;
  int64 exchanges = 2;
}

message ResultsReply {
  repeated OutcomeCount outcomes = 1;
  repeated BlockerCount blockers = 2;
  repeated SourceCount sources = 3;
  repeated ClosureCount closures = 4;
}

message OutcomeCount {
  string agent = 1;
  string responder_model = 2;
  Outcome outcome = 3;
  int64 items = 4;
}

message BlockerCount {
  string agent = 1;
  BlockerKind kind = 2;
  int64 items = 3;
}

message SourceCount {
  string agent = 1;
  string source = 2;
  int64 items = 3;
}

message ClosureCount {
  string agent = 1;
  int64 by_consensus = 2;
  int64 by_person = 3;
}

message FlagsReply {
  repeated FlagView flags = 1;
  repeated CycleView cycles = 2;
}

message FlagView {
  FlagKind kind = 1;
  int64 exchange_id = 2;           // zero for FLAG_KIND_NOT_VOTED, which waits on a vote rather than an exchange
  string conversation_id = 3;
  string waiting_on = 4;
  string waiting = 5;
  string since_utc = 6;
}

message CycleView {
  int64 exchange_id = 1;
  string conversation_id = 2;
  repeated string path = 3;
  string recorded_utc = 4;
}

message ExportRequest {
  string conversation_id = 1;
}

message ExportReply {
  repeated Message messages = 1;

  // Beside the messages rather than fetched separately, because a reader wants both at one instant.
  repeated ExchangeSnapshot exchanges = 2;

  // Set only when this conversation was destroyed, in which case the two above are empty. Absent with
  // both above empty means there was no such conversation ever: an empty export cannot otherwise be
  // told from a store that lost something (section 14).
  optional DestroyedConversation destroyed = 3;

  // The roadmap item this conversation belongs to, by the broker's reservation and by nothing in any message.
  optional RoadmapItemRef item = 4;
}

// Facts and no content (section 9.4). There is no field to put message text in.
message DestroyedConversation {
  string conversation_id = 1;
  string destroyed_utc = 2;
  int32 messages = 3;
  repeated string participants = 4;
}

message ExchangeSnapshot {
  int64 exchange_id = 1;
  ExchangeState state = 2;
  string opened_utc = 3;
  string closed_utc = 4;              // empty while it is open
  ExchangeOutcome outcome = 5;        // UNSPECIFIED while it is open
  int64 settled_by = 6;               // 0 unless the outcome is SETTLED (section 5.6)
}

message ImplementsReply {
  string protocol_version = 1;
  string broker_version = 2;          // the build serving this, so a surface can say when it is not from the same release
  repeated string store_problems = 3; // how this broker's store differs from the shape the build expects; empty when it matches
}

// Deliberately carries no project. Section 4.1: membership is which endpoint the caller connected to.
message ListConversationsRequest {
  string participant = 1;             // empty for every conversation
  string since_utc = 2;               // empty for no lower bound
  string until_utc = 3;               // empty for no upper bound
  int32 page_size = 4;                // the broker bounds this whatever is asked for
  string page_token = 5;              // empty for the first page
  bool include_archived = 6;          // false omits them, and says how many were omitted
}

message ListConversationsReply {
  repeated ConversationSummary conversations = 1;
  string next_page_token = 2;         // empty at the end

  // Part of the contract: archiving does not stop a conversation receiving messages, so a caller that
  // could not tell they existed would be hiding traffic rather than filing it.
  int32 archived_omitted = 3;
}

message ConversationSummary {
  string conversation_id = 1;
  repeated string participants = 2;
  int32 messages = 3;
  string first_activity_utc = 4;
  string last_activity_utc = 5;
  bool has_open_exchange = 6;
  bool archived = 7;
  optional RoadmapItemRef item = 8;   // section 5.7: set when it is a reserved item conversation
}

message WaitingReply {
  repeated WaitingEdge edges = 1;
}

message WaitingEdge {
  string waiter = 1;
  string waited_on = 2;
  int64 exchange_id = 3;
}

message RecordOwnershipRequest {
  string agent = 1;
  string statement = 2;
  OwnershipSource source = 3;
  // The length of the AGENT'S OWN message, or 0 when there was no proposal. A person's characters are
  // never counted here: this is the evidence the removed bound on `owns` has to be chosen against.
  int32 proposed_length = 4;
  string conversation_id = 5;         // empty only when the line was composed with no ask
}

message RecordOwnershipReply {
  bool recorded = 1;
  string problem = 2;                 // empty when it was recorded
  // What peers read RIGHT NOW, which is not what was accepted until the agent restarts. A surface says
  // the line is pending by comparing the two rather than by keeping a flag somebody has to clear.
  string live_statement = 3;
  bool pending = 4;
}

message FacilitationReply {
  bool auto_accept = 1;
  repeated OwnershipQuestion questions = 2;   // each agent's latest question, if it was ever asked
}

message OwnershipQuestion {
  string agent = 1;
  string conversation_id = 2;
  int64 exchange_id = 3;
  QuestionState state = 4;
  string answer = 5;                  // the agent's words as written; empty until it answers
  string flattened = 6;               // the same words on one line; empty until it answers
  string waiting_because = 7;         // why it waits for a person; empty unless waiting
  string asked_utc = 8;
  string settled_utc = 9;             // empty until accepted or discarded
}

enum QuestionState {
  QUESTION_STATE_UNSPECIFIED = 0;
  QUESTION_STATE_ASKED = 1;
  QUESTION_STATE_ASKED_BACK = 2;
  QUESTION_STATE_ANSWERED = 3;
  QUESTION_STATE_WAITING = 4;
  QUESTION_STATE_ACCEPTED = 5;
  QUESTION_STATE_DISCARDED = 6;
}

message SetAutoAcceptRequest {
  bool on = 1;
}

message SetAutoAcceptReply {
  bool on = 1;                        // as now set
}

message ReplyToAskedBackRequest {
  string agent = 1;
  string text = 2;                    // the person's words, held to the message cap
}

message FacilitationActionReply {
  bool done = 1;
  string problem = 2;                 // empty when it was done
}

message PruneReply {
  int32 removed = 1;
  int32 held_by_floor = 2;
  int32 contended = 3;
  bool capped = 4;
}

// ===========================================================================================
// Enumerations
//
// Every one of these is a copy of a C# enum, and a copy is a thing that can drift. Each starts at a
// zero-valued UNSPECIFIED that the C# side has no member for -- so a value the broker has never heard
// of arrives as UNSPECIFIED and is refused, rather than arriving as whichever member is numbered zero.
// TransportEnumTests pins each against its counterpart.
// ===========================================================================================

enum AgentTier {
  AGENT_TIER_UNSPECIFIED = 0;
  AGENT_TIER_FULL = 1;
  AGENT_TIER_PULL = 2;
  AGENT_TIER_HEADLESS = 3;
}

enum AgentStatus {
  AGENT_STATUS_UNSPECIFIED = 0;
  AGENT_STATUS_ACTIVE = 1;
  AGENT_STATUS_RETIRED = 2;
}

enum AgentPresence {
  AGENT_PRESENCE_UNSPECIFIED = 0;
  AGENT_PRESENCE_STRANDED = 1;
  AGENT_PRESENCE_STARTABLE = 2;
  AGENT_PRESENCE_RUNNING = 3;
  // The person seat only (section 14): a surface is open and in use, or nobody is at a screen. A person has no
  // machine and is never started, so stranded and startable would each say something false about them.
  AGENT_PRESENCE_HERE = 4;
  AGENT_PRESENCE_AWAY = 5;
}

// Why a Request was refused. A value rather than a sentence: composing the sentence is the adapter's
// job, since it is the half of the system that knows what its model reads.
enum RequestRejection {
  REQUEST_REJECTION_UNSPECIFIED = 0;
  REQUEST_REJECTION_NONE = 1;
  REQUEST_REJECTION_SATURATED = 2;
  REQUEST_REJECTION_DUPLICATE = 3;
  REQUEST_REJECTION_RECEIVER_NOT_REGISTERED = 4;
  REQUEST_REJECTION_RECEIVER_RETIRED = 5;
  REQUEST_REJECTION_SENDER_RETIRED = 6;
  REQUEST_REJECTION_CONVERSATION_CLOSED = 7;
  REQUEST_REJECTION_CONVERSATION_NOT_ASSIGNABLE = 8;
  REQUEST_REJECTION_NO_SUCH_ROLE = 9;
  REQUEST_REJECTION_RECEIVER_IS_THE_FACILITATOR = 10;  // the facilitator receives nobody's work (section 10.1)
}

enum TransitionError {
  TRANSITION_ERROR_UNSPECIFIED = 0;
  TRANSITION_ERROR_NONE = 1;
  TRANSITION_ERROR_EXCHANGE_NOT_OPEN = 2;
  TRANSITION_ERROR_NOT_A_PARTICIPANT = 3;
  TRANSITION_ERROR_NOT_YOUR_TURN = 4;
  TRANSITION_ERROR_ONLY_RECEIVER_SENDS_RESULT = 5;
  TRANSITION_ERROR_CLARIFY_DEPTH_EXCEEDED = 6;
  TRANSITION_ERROR_CLOSED_IS_THE_BROKERS = 7;
  TRANSITION_ERROR_CANNOT_SETTLE = 8;
}

// Why an exchange named in settles could not be settled (section 5.6).
enum SettleProblem {
  SETTLE_PROBLEM_UNSPECIFIED = 0;
  SETTLE_PROBLEM_NOT_FROM_THE_PERSON = 1;   // the reply is not on a Request the person opened with this agent
  SETTLE_PROBLEM_OTHER_CONVERSATION = 2;
  SETTLE_PROBLEM_NOT_OPEN = 3;              // closed, or no such exchange; not told apart, as elsewhere
  SETTLE_PROBLEM_NOT_BETWEEN_YOU = 4;
  SETTLE_PROBLEM_NOT_THEIR_MOVE = 5;
}

// What became of the attempt to put a message in front of its receiver. None of these is a refusal:
// the message is stored before any of this is decided.
enum WakeOutcome {
  WAKE_OUTCOME_UNSPECIFIED = 0;
  WAKE_OUTCOME_STARTED = 1;
  WAKE_OUTCOME_ALREADY_RUNNING = 2;
  WAKE_OUTCOME_ALREADY_COMING = 3;
  WAKE_OUTCOME_UNREACHABLE = 4;
  // The receiver is the person seat (section 12.3): they have it and will answer, whether here or
  // away. No machine was asked to start anybody, because nothing starts a person.
  WAKE_OUTCOME_WITH_THE_PERSON = 5;
  // The receiver is running only as a process Parley did not start (section 11.7): nobody was asked, and it reads
  // the message when somebody prompts it.
  WAKE_OUTCOME_OPEN_OUTSIDE = 6;
}

enum ClosureError {
  CLOSURE_ERROR_UNSPECIFIED = 0;
  CLOSURE_ERROR_NONE = 1;
  CLOSURE_ERROR_NOT_A_PARTICIPANT = 2;
}

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_REQUEST = 1;
  MESSAGE_TYPE_CLARIFY = 2;
  MESSAGE_TYPE_RESULT = 3;
}

// How a person arrived at the ownership line they accepted. A person's own characters are never
// attributed to a model, which is why `edited` and `composed` are told apart from `proposed` at all.
enum OwnershipSource {
  OWNERSHIP_SOURCE_UNSPECIFIED = 0;
  OWNERSHIP_SOURCE_PROPOSED = 1;      // the agent's own words, untouched
  OWNERSHIP_SOURCE_EDITED = 2;        // the agent's proposal, changed by the person
  OWNERSHIP_SOURCE_COMPOSED = 3;      // written by the person, with no ask at all
  OWNERSHIP_SOURCE_AUTOMATIC = 4;     // the agent's own words, made its line by Auto Accept; never sent by a client
}

enum ExchangeState {
  EXCHANGE_STATE_UNSPECIFIED = 0;
  EXCHANGE_STATE_OPEN = 1;
  EXCHANGE_STATE_CLOSED = 2;
}

// An exchange's rolled-up outcome (section 5.3). UNSPECIFIED is what an open exchange carries.
enum ExchangeOutcome {
  EXCHANGE_OUTCOME_UNSPECIFIED = 0;
  EXCHANGE_OUTCOME_COMPLETE = 1;
  EXCHANGE_OUTCOME_BLOCKED = 2;
  EXCHANGE_OUTCOME_CLOSED = 3;
  EXCHANGE_OUTCOME_SETTLED = 4;       // an agent's question to the person, settled by the agent (section 5.6)
}

// What a Request came to (section 5.3).
enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_DONE = 1;
  OUTCOME_ANSWERED = 2;
  OUTCOME_ACKNOWLEDGED = 3;
  OUTCOME_BLOCKED = 4;
  OUTCOME_CLOSED = 5;
}

enum BlockerKind {
  BLOCKER_KIND_UNSPECIFIED = 0;
  BLOCKER_KIND_MISSING_INFORMATION = 1;
  BLOCKER_KIND_CONFLICT = 2;
  BLOCKER_KIND_PERMISSION = 3;
}

// Who closed a conversation. UNSPECIFIED where nothing recorded it.
enum ConversationCloser {
  CONVERSATION_CLOSER_UNSPECIFIED = 0;
  CONVERSATION_CLOSER_CONSENSUS = 1;
  CONVERSATION_CLOSER_PERSON = 2;
}

enum FlagKind {
  FLAG_KIND_UNSPECIFIED = 0;
  FLAG_KIND_NOT_COLLECTED = 1;
  FLAG_KIND_NO_PROGRESS = 2;
  FLAG_KIND_RETIRED = 3;
  FLAG_KIND_NOT_VOTED = 4;
  // The owing agent's last turn ended with tool calls refused for want of permission, and it has said nothing since
  // (section 6). Raised at once, not after a threshold.
  FLAG_KIND_PERMISSION_REFUSED = 5;
}

enum Vote {
  VOTE_UNSPECIFIED = 0;
  VOTE_DONE = 1;
  VOTE_NOT_DONE = 2;
}

enum PurgeVerdict {
  PURGE_VERDICT_UNSPECIFIED = 0;
  PURGE_VERDICT_NOT_REGISTERED = 1;
  PURGE_VERDICT_GONE = 2;
}

// ===========================================================================================
// Roadmaps -- SPEC.md section 5.7
// ===========================================================================================

enum ProposalState {
  PROPOSAL_STATE_UNSPECIFIED = 0;     // in a request, every state
  PROPOSAL_STATE_WAITING = 1;
  PROPOSAL_STATE_CONFIRMED = 2;
  PROPOSAL_STATE_DECLINED = 3;
  PROPOSAL_STATE_SUPERSEDED = 4;
}

enum RoadmapOrigin {
  ROADMAP_ORIGIN_UNSPECIFIED = 0;
  ROADMAP_ORIGIN_PROPOSED = 1;
  ROADMAP_ORIGIN_EDITED = 2;
}

// One item as it is proposed, confirmed or edited, before it has an identity of its own.
message RoadmapItemDraft {
  int32 number = 1;                   // the existing item this carries across an edit; 0 for a new one
  string text = 2;                    // one line, led by a verb
  string intended_agent = 3;          // empty when not known; a suggestion and never an assignment
  repeated int32 needs = 4;           // one-based positions in this list, each earlier than this item
}

message RoadmapContent {
  string title = 1;
  repeated RoadmapItemDraft items = 2;
}

message ProposeRoadmapRequest {
  string agent = 1;                   // the caller, as every Agents request names it
  RoadmapContent content = 2;
  string conversation_id = 3;         // where it came from; empty when none
  string revises = 4;                 // the title of a roadmap it would change, a hint; empty when none
}

message ProposeRoadmapReply {
  int64 proposal_id = 1;              // 0 when refused
  string problem = 2;                 // empty when it was stored
}

message RoadmapNotice {
  int64 proposal_id = 1;
  string title = 2;                   // the agent's own
  ProposalState outcome = 3;
  string created_utc = 4;
}

message RoadmapSummary {
  int64 id = 1;
  int32 number = 2;
  string title = 3;
  int32 revision = 4;
  int32 live_items = 5;
  int32 started_items = 6;
}

message RoadmapsReply {
  repeated RoadmapSummary roadmaps = 1;
}

message RoadmapRequest {
  int64 id = 1;
}

// What the broker holds about one live item's conversation. Facts and never a state (section 5.7).
message ItemFacts {
  bool conversation_exists = 1;
  int32 open_exchanges = 2;
  bool collected = 3;
  int32 complete_exchanges = 4;
  int32 blocked_exchanges = 5;
  int32 closed_exchanges = 6;
  string blocker = 7;                 // empty when none
  string closed_by = 8;               // empty while the conversation is not closed
  bool destroyed = 9;
  string first_sent_text = 10;        // empty when nothing was sent
  repeated int64 open_exchange_ids = 11;   // to join with the wait-for graph
}

message RoadmapItemDetail {
  int64 id = 1;
  int32 number = 2;
  int32 position = 3;
  string text = 4;
  string intended_agent = 5;
  repeated int32 needs = 6;           // item numbers
  string conversation_name = 7;
  int32 removed_revision = 8;         // 0 while live
  optional ItemFacts facts = 9;       // live items only
}

message RoadmapDetail {
  int64 id = 1;
  int32 number = 2;
  string title = 3;
  RoadmapOrigin origin = 4;
  string proposer = 5;                // as text, empty when none
  int32 revision = 6;
  repeated RoadmapItemDetail items = 7;
}

message RoadmapReply {
  optional RoadmapDetail roadmap = 1; // absent when there is no such roadmap
}

message ProposalsRequest {
  ProposalState state = 1;            // UNSPECIFIED for every state
}

message ProposalDetail {
  int64 id = 1;
  string proposer = 2;
  string source_conversation = 3;
  string target_title = 4;
  RoadmapContent content = 5;
  int64 size = 6;
  ProposalState state = 7;
  string created_utc = 8;
  string decided_utc = 9;             // empty while waiting
}

message ProposalsReply {
  repeated ProposalDetail proposals = 1;
}

message ProposalRequest {
  int64 id = 1;
}

message ConfirmProposalRequest {
  int64 id = 1;
  RoadmapContent content = 2;         // the person's final content, which may be the proposal's own
  int64 target_roadmap = 3;           // 0 for a new roadmap
}

message EditRoadmapRequest {
  int64 id = 1;
  int32 revision = 2;                 // the revision the caller read
  RoadmapContent content = 3;
}

message RoadmapChangeReply {
  bool done = 1;
  string problem = 2;                 // empty when it was done
  int64 roadmap_id = 3;
  int32 revision = 4;
  RoadmapOrigin origin = 5;           // how the broker found the content related to the proposal
}

// The roadmap item a conversation belongs to, by the broker's reservation (section 5.7).
message RoadmapItemRef {
  int64 roadmap_id = 1;
  int32 roadmap_number = 2;
  string title = 3;
  int32 item_number = 4;
  bool removed = 5;
}
