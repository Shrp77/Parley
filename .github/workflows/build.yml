name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three platforms on every push: three processes hold sockets open to
        # each other, and sockets, keep-alives and graceful shutdown are exactly
        # where the platforms differ. Linux also covers path handling, line
        # endings, case sensitivity and the SQLite build.
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Warnings are errors, documentation is enforced, and NuGetAudit fails the
      # build on high or critical advisories. A green build here means all three
      # passed, so no separate lint step is required.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # PARLEY_HEARTBEAT makes every broker a server test starts log a line a second and every connection. A test
      # project's console output is printed here only when the project fails, so a failure seen only on a runner says
      # what its broker was doing: starved, stopped, or which side closed a connection.
      - name: Test
        env:
          PARLEY_HEARTBEAT: '1'
        run: dotnet test --no-build --configuration Release --verbosity normal

  dependencies:
    name: dependency health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # A log, never a failure: high and critical advisories already fail the build through
      # NuGetAudit, and low and moderate ones are non-fatal on purpose (CLAUDE.md). It lists
      # every severity so a lower one is seen before it is raised.
      - name: Vulnerable packages
        run: dotnet list package --vulnerable --include-transitive

      # Deprecation produces no build warning at all, and the command exits 0 whatever it
      # finds, so the step fails on its own output. The xUnit v2 deprecation was only caught
      # by looking.
      - name: Deprecated packages
        shell: bash
        run: |
          dotnet list package --deprecated | tee deprecated.txt
          if grep -q "has the following deprecated packages" deprecated.txt; then
            echo "::error::A package is deprecated; replace it before merging."
            exit 1
          fi
