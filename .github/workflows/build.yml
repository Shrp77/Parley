name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The macOS leg is deferred rather than deleted: run this by hand with the box
  # ticked before a release, or whenever the transport work below actually lands.
  workflow_dispatch:
    inputs:
      macos:
        description: "Also run the macOS leg"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows and Linux on every push; macOS only when asked for.
        #
        # The three-platform matrix was justified by the transport claiming parity
        # across named pipes and Unix domain sockets. There is no transport: the
        # only thing that crosses a process boundary today is MCP over stdio, and
        # the store is a local SQLite file. So the macOS leg was defending a claim
        # nothing in this repository makes yet, on a platform nobody here can
        # reproduce a failure on.
        #
        # Linux still covers the Unix side of everything that does exist -- path
        # handling, line endings, case sensitivity, and the SQLite build. What
        # macOS would add is Darwin-specific behaviour, which becomes worth paying
        # for when the transport lands and not before. Restore it by deleting the
        # fromJSON below, and restore the sentence in CLAUDE.md with it.
        os: >-
          ${{ fromJSON(
            (github.event_name == 'workflow_dispatch' && inputs.macos)
              && '["windows-latest","ubuntu-latest","macos-latest"]'
              || '["windows-latest","ubuntu-latest"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Warnings are errors, documentation is enforced, and NuGetAudit fails the
      # build on high or critical advisories. A green build here means all three
      # passed, so no separate lint step is required.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  dependencies:
    name: dependency health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Advisories are published continuously, so a package that was clean at merge
      # can be vulnerable a week later without anything in the repository changing.
      - name: Vulnerable packages
        run: dotnet list package --vulnerable --include-transitive

      # Deprecation produces no build warning at all. The xUnit v2 deprecation was
      # only caught by looking; this makes it visible without looking.
      - name: Deprecated packages
        run: dotnet list package --deprecated
