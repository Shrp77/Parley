name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three platforms on every push, for the unit tests' path handling, line
        # endings and case sensitivity. The socket and process tests, where the
        # platforms differ most, are integration tests and run in nightly.yml.
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Warnings are errors, documentation is enforced, and NuGetAudit fails the
      # build on high or critical advisories. A green build here means all three
      # passed, so no separate lint step is required.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Only the unit tests on a push: they run in seconds. The integration tests run nightly and, by hand, before a
      # pull request merges (nightly.yml; review/README.md). PARLEY_HEARTBEAT makes every broker a test starts log a line
      # a second, so a failure seen only on a runner says what its broker was doing.
      - name: Test
        shell: pwsh
        env:
          PARLEY_HEARTBEAT: '1'
        run: ./scripts/test.ps1 -Category Unit -Configuration Release -Source ci -AllResults -MetricsDirectory artifacts/test-metrics

      # Kept whether the tests passed or not: a failure is what the metrics are for (scripts/pull-test-metrics.ps1).
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-metrics-${{ matrix.os }}
          path: artifacts/test-metrics
          retention-days: 90

  dependencies:
    name: dependency health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # A log, never a failure: high and critical advisories already fail the build through
      # NuGetAudit, and low and moderate ones are non-fatal on purpose (CLAUDE.md). It lists
      # every severity so a lower one is seen before it is raised.
      - name: Vulnerable packages
        run: dotnet list package --vulnerable --include-transitive

      # Deprecation produces no build warning at all, and the command exits 0 whatever it
      # finds, so the step fails on its own output. The xUnit v2 deprecation was only caught
      # by looking. Only packages this repository names fail it: a deprecated package another
      # one depends on (xunit.v3 on Microsoft.Testing.Platform.MSBuild, as of 4.0.0) is not
      # ours to replace, so the transitive list is printed beside it to be read, not to fail.
      - name: Deprecated packages
        shell: bash
        run: |
          dotnet list package --deprecated | tee deprecated.txt
          if grep -q "has the following deprecated packages" deprecated.txt; then
            echo "::error::A package is deprecated; replace it before merging."
            exit 1
          fi
          dotnet list package --deprecated --include-transitive
