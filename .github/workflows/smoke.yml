name: smoke

# What a pull request must pass before it merges (review/README.md): every test but those marked [Slow], on Windows and Linux,
# in no more than five minutes of testing. The rest run nightly against main, in the nightly workflow.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: smoke tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        shell: pwsh
        env:
          PARLEY_HEARTBEAT: '1'
        run: ./scripts/test.ps1 -Category Smoke -Configuration Release -Source ci -AllResults -MetricsDirectory artifacts/test-metrics

      # Kept whether the tests passed or not: a failure is what the metrics are for.
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-metrics-${{ matrix.os }}
          path: artifacts/test-metrics
          retention-days: 90
